name: "🐛 Report a bug"
description: Report a reproducible problem in Nexterm Neo.
title: "[Bug] "
labels: ["bug"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a report for this problem.
          required: true

  - type: input
    id: version
    attributes:
      label: Nexterm Neo version
      description: Include the release, development tag, or image tag you are using.
      placeholder: e.g. development or v1.2.3
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Server
        - Web client
        - Engine
        - Connector app
        - Mobile app
        - CLI
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what happened and where you encountered it.
      placeholder: When I ..., Nexterm Neo ...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps and any setup needed to reproduce the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect Nexterm Neo to do?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment and additional context
      description: Include relevant OS, browser/device, deployment details, logs, or screenshots. Remove passwords, tokens, private keys, and other sensitive data before sharing.
    validations:
      required: false

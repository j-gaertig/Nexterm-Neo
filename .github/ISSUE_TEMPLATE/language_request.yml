name: "🌍 Request a language"
description: Request a new interface language for Nexterm Neo.
title: "[Language] "
labels: ["translation"]
body:
  - type: markdown
    attributes:
      value: "Nexterm Neo translations are managed through [Crowdin](https://crowdin.com/project/nexterm). This form is for requesting a language that is not available yet; translation contributions should be made on Crowdin."

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the available languages and existing issues, and this language is not already supported or requested.
          required: true

  - type: input
    id: language
    attributes:
      label: Requested language
      description: Enter the language name and, if known, its locale code.
      placeholder: e.g. German (de-DE)
    validations:
      required: true

  - type: textarea
    id: audience
    attributes:
      label: Who would benefit?
      description: Briefly explain who would use Nexterm Neo in this language or why it would be useful.
    validations:
      required: true

  - type: dropdown
    id: help
    attributes:
      label: Can you help with the translation on Crowdin?
      options:
        - "Yes"
        - "No"
        - "Maybe"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any relevant details, such as regional variants or terminology.
    validations:
      required: false

name: "💡 Suggest a feature"
description: Suggest a focused improvement for Nexterm Neo.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked existing issues and discussions for a similar suggestion.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Server
        - Web client
        - Engine
        - Connector app
        - Mobile app
        - CLI
        - Landing page
        - Documentation
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what gets in the way today?
      placeholder: As a Nexterm Neo user, I want to ... because ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior or improvement you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and additional context
      description: Mention any workarounds, alternatives, or examples that help explain the request.
    validations:
      required: false

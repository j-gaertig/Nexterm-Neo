name: Sync upstream Nexterm

on:
  schedule:
    - cron: '0 2 * * *'
      timezone: "Europe/Berlin"
    - cron: '0 8 * * *'
      timezone: "Europe/Berlin"
    - cron: '0 14 * * *'
      timezone: "Europe/Berlin"
    - cron: '0 20 * * *'
      timezone: "Europe/Berlin"
  workflow_dispatch:

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-upstream:
    name: Merge upstream main when conflict-free
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync upstream
        shell: bash
        run: bash scripts/sync-upstream.sh

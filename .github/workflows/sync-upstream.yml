name: Sync upstream Nexterm

on:
  # ghacron: "0 */4 * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-upstream:
    name: Merge upstream main when conflict-free
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync upstream
        shell: bash
        run: bash scripts/sync-upstream.sh
